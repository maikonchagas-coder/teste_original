<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1459a8">
  <title>Ranfy — Sua opinião faz a diferença</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-login">
  <main class="login-shell">
    <a class="brand brand-image" href="index.html" aria-label="Ranfy, início"><img src="assets/ranfy-logo.png" alt="Ranfy — Mundo SENAI"></a>



    
    <section class="login-content" aria-labelledby="page-title">
      <span class="eyebrow"><span class="eyebrow-dot"></span> MUNDO SENAI</span>
      <h1 id="page-title">Sua opinião<br>faz a <span class="text-accent">diferença.</span></h1>
      <p class="lead">Avalie os projetos que estão transformando ideias em inovação no Mundo SENAI.</p>





      <!-- Futuramente: JavaScript deverá validar e armazenar o nome do participante. -->
      <form id="login-form" class="login-form">
        <label for="participant-name">Como podemos chamar você?</label>
        <input id="participant-name" name="nome" type="text" placeholder="Digite seu nome" autocomplete="name" required maxlength="80">
        <button class="button button-primary button-wide" type="submit">
          Continuar <span class="button-arrow" aria-hidden="true">↗</span>
        </button>
      </form>




      <p class="privacy-note"><span class="tiny-pixel" aria-hidden="true"></span> Rápido, simples e feito para valorizar boas ideias.</p>
    </section>

    <footer class="page-footer"><span>INOVAÇÃO EM MOVIMENTO</span><span class="footer-line"></span><span>MUNDO SENAI</span></footer>
  </main>
  <script src="js/login.js"></script>
  <aside class="pixel-decoration" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></aside>
</body>
</html>
