<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1459a8">
  <title>Ranfy — Escaneie o projeto</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand brand-image" href="index.html" aria-label="Ranfy, início"><img src="assets/senai.png"
          alt="Ranfy — Mundo SENAI"></a>
    </header>

    <main class="scanner-main">
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Voltar</a>
      <section class="scanner-content">
        <span class="eyebrow"><span class="eyebrow-dot"></span> PRÓXIMO PASSO</span>
        <h1>Escaneie o <span class="text-accent">projeto.</span></h1>
        <p class="lead">Posicione o QR Code do estande dentro da área indicada.</p>

        <div class="scanner-frame scanner-frame-live">
          <span class="scan-corner corner-tl"></span><span class="scan-corner corner-tr"></span>
          <span class="scan-corner corner-bl"></span><span class="scan-corner corner-br"></span>
          <div id="reader" aria-label="Leitor de QR Code"></div>
          <span class="scanner-label">APONTE PARA O QR CODE</span>
        </div>

        <p id="scanner-status" class="scanner-hint" role="status"><span class="status-dot"></span> Toque em “Ativar
          câmera” para começar a leitura.</p>
        <button class="button button-primary camera-button" id="start-camera" type="button">Ativar câmera <span
            aria-hidden="true">▣</span></button>

        <form id="manual-project-form" class="manual-form">
          <label for="project-code">Ou digite o código do projeto</label>
          <div class="manual-input-row">
            <input id="project-code" type="text" placeholder="Ex.: 001" maxlength="100" required>
            <button class="button button-secondary" type="submit">Continuar <span aria-hidden="true">→</span></button>
          </div>
          <p id="manual-status" class="scanner-hint" role="status"></p>
        </form>
      </section>
    </main>
  </div>

  <!-- Leitor real da câmera do celular. Requer HTTPS/localhost e internet para carregar a biblioteca. -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/app.js"></script>



  <script>
    (() => {
      const form = document.getElementById("manual-project-form");

      if (!form) return;

      const input = document.getElementById("project-code");
      const status = document.getElementById("manual-status");
      const botao = form.querySelector('[type="submit"]');

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const codigo = input.value.trim();

        if (!codigo) {
          status.textContent = "Digite o código do projeto.";
          return;
        }

        botao.disabled = true;
        status.textContent = "Verificando projeto...";

        try {
          const resposta = await fetch(
            `/api/projetos/${encodeURIComponent(codigo)}`
          );

          const resultado = await resposta.json();

          if (resposta.status === 404) {
            status.textContent =
              "Projeto não encontrado. Confira o código.";
            return;
          }

          if (!resposta.ok) {
            throw new Error(
              resultado.erro || "Erro ao consultar o projeto."
            );
          }

          window.location.href =
            `/page/${encodeURIComponent(resultado.codigo)}`;

        } catch (erro) {
          console.error(erro);

          status.textContent =
            "Não foi possível verificar o projeto. Tente novamente.";

        } finally {
          botao.disabled = false;
        }
      });
    })();
  </script>



</body>

</html>
