<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1459a8">
  <title>Ranfy — Avaliação concluída</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .completion-main{min-height:72vh;display:grid;place-items:center;text-align:center;padding:35px 0}
    .completion-card{max-width:560px;width:100%;padding:clamp(24px,5vw,48px);background:#fff;border:3px solid #1459a8;box-shadow:8px 8px 0 #f28b35}
    .completion-icon{width:82px;height:82px;margin:0 auto 24px;display:grid;place-items:center;background:#d9fbe8;color:#087443;border:3px solid #087443;font-size:2.5rem;box-shadow:5px 5px 0 #b9e8cf}
    .completion-card h1{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 16px}
    .completion-card .lead{margin:0 auto 28px}
    .completion-card .button{max-width:330px;margin:auto}
  </style>
</head>
<body class="page">
  <div class="app-shell">
    <header class="app-header"><a class="brand brand-image" href="index.html" aria-label="Ranfy, início"><img src="assets/ranfy-logo.png" alt="Ranfy — Mundo SENAI"></a><span class="event-label">MUNDO SENAI <span class="tiny-pixel" aria-hidden="true"></span></span></header>
    <main class="completion-main">
      <section class="completion-card">
        <div class="completion-icon" aria-hidden="true">✓</div>
        <span class="eyebrow"><span class="eyebrow-dot"></span> OBRIGADO PELA AVALIAÇÃO</span>
        <h1>Avaliação <span class="text-accent">concluída!</span></h1>
        <p class="lead">Obrigado por compartilhar sua opinião e apoiar as ideias do Mundo SENAI.</p>
      </section>
    </main>
    <footer class="app-footer"><span>OBRIGADO POR PARTICIPAR</span><span class="footer-line"></span><span class="footer-index">04 <span>/ 04</span></span></footer>
  </div>
  <script src="js/app.js"></script>

</html>
