<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1459a8">
  <title>Ranfy — Descubra um projeto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand brand-image" href="index.html" aria-label="Ranfy, início"><img src="assets/ranfy-logo.png" alt="Ranfy — Mundo SENAI"></a>
      <div class="header-meta"><span class="greeting">Olá, <span data-participant-name>visitante</span></span><span class="event-label">MUNDO SENAI <span class="tiny-pixel" aria-hidden="true"></span></span></div>
    </header>

    <main class="home-main">
      <div class="qr-hero" aria-hidden="true">
        <div class="qr-art">
          <span class="finder finder-one"></span><span class="finder finder-two"></span><span class="finder finder-three"></span>
          <span class="qr-pixel p1"></span><span class="qr-pixel p2"></span><span class="qr-pixel p3"></span><span class="qr-pixel p4"></span>
          <span class="qr-pixel p5"></span><span class="qr-pixel p6"></span><span class="qr-pixel p7"></span><span class="qr-pixel p8"></span>
          <span class="qr-pixel p9"></span><span class="qr-pixel p10"></span><span class="qr-pixel p11"></span><span class="qr-pixel p12"></span>
        </div>
        <span class="hero-orbit orbit-one"></span><span class="hero-orbit orbit-two"></span>
        <span class="hero-spark spark-one">✳</span><span class="hero-spark spark-two">+</span>
      </div>

      <section class="home-copy">
        <span class="eyebrow"><span class="eyebrow-dot"></span> IDEIAS QUE MOVEM O FUTURO</span>
        <h1>Qual projeto<br>vamos <span class="text-accent">descobrir?</span></h1>
        <p class="lead">Escaneie o QR Code do estande para avaliar a apresentação.</p>
        <a class="button button-primary button-wide" href="qrcode.html">Ler QR Code <span class="button-arrow" aria-hidden="true">↗</span></a>
        <p class="microcopy"><span class="microcopy-icon" aria-hidden="true">◷</span> Leva apenas alguns segundos.</p>
      </section>
    </main>
    <footer class="app-footer"><span>UMA PLATAFORMA PARA BOAS IDEIAS</span><span class="footer-line"></span><span class="footer-index">01 <span>/</span> 04</span></footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
